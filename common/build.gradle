architectury {
    common enabled_platforms.split(',')
}
loom {
    accessWidenerPath = file("src/main/resources/starmineradditions.accesswidener.json")
}


dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$project.fabric_loader_version"

    modImplementation "dev.architectury:architectury:$project.architectury_api_version"
    modImplementation "com.teamresourceful.resourcefullib:resourcefullib-common-1.20.1:2.1.29"
    compileOnly "mod.azure.azurelib:azurelib-common-$project.minecraft_version:$project.azurelib_version"

    // Valkyrien Skies core API (platform-agnostic) for shared gravity-on-ships logic.
    // As of VS core 1.1.0+ea6dc8576e the former `api-game` module was folded into `api`,
    // so there is a single artifact to depend on.
    modCompileOnly("org.valkyrienskies.core:api:$vscore_version")
    compileOnly("org.valkyrienskies.core:internal:$vscore_version") { exclude group: "org.joml" }
    // VS2's common module (VSGameUtilsKt etc.), identical in the Forge and Fabric jars
    modCompileOnly("org.valkyrienskies:valkyrienskies-120-common:$vs2_version") { transitive = false }

    // VS-Gravity's loader-neutral module: GravityBridge's backend (VSGravityBridge) links against it
    modCompileOnly("net.memezforbeanz.gravityapi:gravityapi-common:$gravityapi_version") { transitive = false }

    // ModernUI. The loader artifact is the MC bridge (icyllis.modernui.mc — MuiModApi
    // etc., identical package in both loader jars); compile against the intermediary
    // Fabric one since loom can remap it, unlike the SRG-mapped Forge jar. The widget/
    // graphics framework is ModernUI-Core, plain Java with no Minecraft classes.
    modCompileOnly("icyllis.modernui:ModernUI-Fabric:$modernui_version")
    compileOnly("icyllis.modernui:ModernUI-Core:$modernui_core_version")
}
