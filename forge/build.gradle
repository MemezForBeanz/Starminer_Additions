plugins {
    id 'com.gradleup.shadow'
}

loom {
    forge {
        mixinConfig "starmineradditions.mixins.json"
    }

    runs {
        client {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }
    }
}

repositories {
    maven {
        name = "AzureDoom Mods"
        url = "https://maven.azuredoom.com/mods"
    }
    maven { url = "https://maven.resourcefulbees.com/repository/maven-public/" }
    maven { url = "https://thedarkcolour.github.io/KotlinForForge/" } // Kotlin For Forge (VS2 runtime)
    // VS-Gravity: local co-development builds (./gradlew publishToMavenLocal in the
    // VS-Gravity repo). For releases, tag the fork and switch the dependency back to the
    // jitpack coordinates (com.github.MemezForBeanz:VS-Gravity:<tag>).
    mavenLocal()
    maven {
        url "https://cursemaven.com"
    }
    mavenCentral()
    repositories {
        maven { url = "https://maven.bawnorton.com/releases" }

        // Mirror
        maven { url = "https://maven.enjarai.dev/mirrors" }
        maven { url "https://maven.teamresourceful.com/repository/maven-public/" }
    }

}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

configurations.all {
    resolutionStrategy {
        force "io.github.llamalad7:mixinextras-common:0.5.5"
        force "io.github.llamalad7:mixinextras-forge:0.5.5"
        force "com.github.bawnorton.mixinsquared:mixinsquared-common:0.3.7"
        force "com.github.bawnorton.mixinsquared:mixinsquared-forge:0.3.7"
        // One Kotlin version across everything -> one module per kotlin package.
        force "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
        force "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    }
}

// groovy
dependencies {
    forge "net.minecraftforge:forge:$project.forge_version"
    modImplementation "dev.architectury:architectury-forge:$project.architectury_api_version"

    // Mixin helper
    compileOnly(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:0.3.7"))
    implementation(include("com.github.bawnorton.mixinsquared:mixinsquared-forge:0.3.7"))

    compileOnly "io.github.llamalad7:mixinextras-common:0.5.5"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.5"
    implementation "io.github.llamalad7:mixinextras-forge:0.5.5"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    // Valkyrien Skies 2

    modImplementation("org.valkyrienskies:valkyrienskies-120-forge:$vs2_version") {
        exclude group: "org.valkyrienskies.core"
    }
    // Exclude only the base joml module (Minecraft ships org.joml:joml)

    // Ship spawner (ForgeShipBridge) compiles against ServerShip etc.
    compileOnly("org.valkyrienskies.core:api:$vscore_version") {
        exclude group: "org.joml", module: "joml"
    }
    forgeRuntimeLibrary("org.valkyrienskies.core:api:$vscore_version") {
        exclude group: "org.joml", module: "joml"
    }
    forgeRuntimeLibrary("org.valkyrienskies.core:util:$vscore_version") {
        exclude group: "org.joml", module: "joml"
    }
    // Kotlin runtime for VS
    forgeRuntimeLibrary "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"

    forgeRuntimeLibrary "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.8.1"
    forgeRuntimeLibrary "org.jetbrains.kotlinx:kotlinx-coroutines-jdk8:1.8.1"
    forgeRuntimeLibrary "org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:1.6.3"
    // The forge jar JiJs VS core's other runtime libraries
    [
        "javax.inject:javax.inject:1",
        "com.google.dagger:dagger:2.43.2",
        "org.apache.commons:commons-math3:3.6.1",
        "org.apache.commons:commons-collections4:4.3",
        "com.fasterxml.jackson.core:jackson-core:2.14.0",
        "com.fasterxml.jackson.core:jackson-annotations:2.14.0",
        "com.fasterxml.jackson.core:jackson-databind:2.14.0",
        "com.fasterxml.jackson.dataformat:jackson-dataformat-cbor:2.14.0",
        "com.fasterxml.jackson.module:jackson-module-parameter-names:2.14.0",
        "com.fasterxml.jackson.module:jackson-module-kotlin:2.14.0-rubyfork",
        "com.github.Rubydesic:jackson-kotlin-dsl:1.2.0",
        "com.networknt:json-schema-validator:1.0.71",
        "com.ethlo.time:itu:1.7.0",
        "com.github.victools:jsonschema-module-jackson:4.25.0",
        "com.github.victools:jsonschema-generator:4.25.0",
        "com.fasterxml:classmate:1.5.1",
        "com.flipkart.zjsonpatch:zjsonpatch:0.4.11",
    ].each { forgeRuntimeLibrary(it) { exclude group: "org.jetbrains.kotlin" } }

    modImplementation("net.memezforbeanz.gravityapi:gravityapi:$gravityapi_version") {
        exclude group: "io.github.llamalad7"
        exclude group: "com.github.bawnorton.mixinsquared"
    }

    // AzureLib: Neo works with forge
    modImplementation "mod.azure.azurelib:azurelib-neo-$minecraft_version:$azurelib_version"

    modImplementation "com.teamresourceful.resourcefullib:resourcefullib-forge-1.20.1:2.1.29"

    // ModernUI (generator screens). The maven loader jar is just the MC bridge — the
    // release jar players install bundles core, but the dev runtime needs it supplied.
    modImplementation("icyllis.modernui:ModernUI-Forge:$modernui_version")
    forgeRuntimeLibrary("icyllis.modernui:ModernUI-Core:$modernui_core_version")

    annotationProcessor "org.spongepowered:mixin:0.8.7:processor"
}


processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }

    // Include common resources like mixins.json
    from(project(':common').file('src/main/resources')) {
        include 'starmineradditions.mixins.json'
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    // Include forge module's own resources
    from(sourceSets.main.output) {
        include 'META-INF/**'
        include '*.json'
        include 'pack.mcmeta'
    }
}

remapJar {
    input.set shadowJar.archiveFile
}