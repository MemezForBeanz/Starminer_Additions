org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
# Mod properties
mod_version=2.0-SNAPSHOT
maven_group=net.memezforbeanz.starminerodyssey
archives_name=starmineradditions
enabled_platforms=fabric,forge
mappings_channel=official

# Minecraft properties
minecraft_version=1.20.1
# Dependencies
architectury_api_version=9.2.14
fabric_loader_version=0.20.1
fabric_api_version=0.92.12+1.20.1
forge_version=1.20.1-47.4.28
energy_version=3.0.0
azurelib_version=3.1.24
clothconfig_version=11.1.136
modmenu_version=7.2.2
botarium_version=2.3.4
# ModernUI (izzel maven). The loader artifacts are only the MC bridge
# (icyllis.modernui.mc); the core widget/graphics framework is ModernUI-Core.
modernui_version=1.20.1-3.12.0.1
modernui_core_version=3.12.0
resourcefullib_version=2.1.29
cardinal_components_version=VERSIONED

# Valkyrien Skies 2 (gravity-on-ships compat). Versions MUST match what the
# gravity-api (min01) mod is built against, so a single VS2/VS-core is on the
# classpath at runtime. See https://maven.valkyrienskies.org/
vs2_version=2.4.13+8ee8012458
vscore_version=1.1.0+75cd6425bf
# VS2 is written in Kotlin and needs the Kotlin runtime (kotlin-stdlib/reflect) at runtime.
# kotlin-stdlib arrives transitively via VS core api/util; this pins the version so every
# Kotlin lib resolves to one module. VS core 1.1.0+ea6dc8576e is built against Kotlin 2.1.0.
kotlin_version=2.1.0

